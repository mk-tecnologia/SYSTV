name: Verificações
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: bash -n deploy/debian/install.sh
      - run: shellcheck deploy/debian/install.sh
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-root-only
