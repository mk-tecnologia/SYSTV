name: Verificações
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: bash -n install.sh deploy/debian/*.sh deploy/debian/systvctl tests/deploy/*.sh
      - run: shellcheck install.sh deploy/debian/*.sh deploy/debian/systvctl tests/deploy/*.sh
      - run: python3 tests/release.test.py
      - run: python3 tests/server-profile.test.py
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-root-only

  debian-13:
    strategy:
      fail-fast: false
      matrix:
        transport: [http, https]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build-release.py
      - name: Preparar Debian 13 descartável com systemd
        run: |
          docker build -t systv-debian-test -f tests/deploy/Dockerfile .
          docker run -d --name systv-debian --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw systv-debian-test
          for attempt in $(seq 1 30); do
            state=$(docker exec systv-debian systemctl is-system-running 2>/dev/null || true)
            if [[ "$state" == running || "$state" == degraded ]]; then break; fi
            sleep 1
          done
          [[ "$state" == running || "$state" == degraded ]]
          docker exec systv-debian mkdir -p /var/tmp/systv-source
          docker cp dist/systv-v$(cat VERSION).tar.gz systv-debian:/var/tmp/systv.tar.gz
          docker exec systv-debian tar -xzf /var/tmp/systv.tar.gz -C /var/tmp/systv-source
          docker cp tests/deploy/server-profile-smoke.sh systv-debian:/var/tmp/server-profile-smoke.sh
          docker cp tests/deploy/smoke.sh systv-debian:/var/tmp/smoke.sh
          docker cp tests/deploy/web-smoke.sh systv-debian:/var/tmp/web-smoke.sh
          docker cp tests/deploy/security-smoke.sh systv-debian:/var/tmp/security-smoke.sh
          docker cp tests/deploy/resume-smoke.sh systv-debian:/var/tmp/resume-smoke.sh
          docker cp tests/deploy/legacy-runtime-smoke.sh systv-debian:/var/tmp/legacy-runtime-smoke.sh
      - name: Testar download e instalação da release publicada
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/systv-bootstrap
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v$(cat VERSION)/install.sh" \
            -o /tmp/systv-bootstrap/install.sh
          docker cp /tmp/systv-bootstrap/install.sh systv-debian:/var/tmp/bootstrap.sh
          docker exec systv-debian bash /var/tmp/bootstrap.sh \
            --version "v$(cat VERSION)" --origin "${{ matrix.transport }}://127.0.0.1"
      - name: Falhar e retomar a primeira instalação
        if: github.event_name != 'workflow_dispatch' && matrix.transport == 'https'
        run: |
          docker exec systv-debian bash /var/tmp/resume-smoke.sh
          docker exec systv-debian rm -rf /var/tmp/systv-source
          docker exec systv-debian mkdir /var/tmp/systv-source
          docker exec systv-debian tar -xzf /var/tmp/systv.tar.gz -C /var/tmp/systv-source
      - name: Instalar, autenticar, atualizar, reverter e reiniciar
        run: |
          docker exec -e SYSTV_TEST_TRANSPORT=${{ matrix.transport }} systv-debian bash /var/tmp/smoke.sh
          docker exec systv-debian bash /var/tmp/security-smoke.sh
          docker exec systv-debian bash /var/tmp/legacy-runtime-smoke.sh
          docker exec systv-debian bash /var/tmp/server-profile-smoke.sh
      - name: Diagnóstico em falha
        if: failure()
        run: |
          docker logs systv-debian || true
          docker exec systv-debian journalctl -u systv -u mariadb -u nginx --no-pager -n 100 || true
      - name: Remover ambiente descartável
        if: always()
        run: docker rm -f systv-debian || true

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Revisar histórico com Gitleaks
        run: |
          audit_dir=$(mktemp -d)
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$audit_dir/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$audit_dir/checksums.txt"
          mv "$audit_dir/gitleaks.tar.gz" "$audit_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          (cd "$audit_dir"; sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$audit_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git . --log-opts=--all --redact=100 --no-banner
