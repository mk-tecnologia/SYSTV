name: Verificações
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: bash -n install.sh deploy/debian/install.sh deploy/debian/systvctl tests/deploy/smoke.sh
      - run: shellcheck install.sh deploy/debian/install.sh deploy/debian/systvctl tests/deploy/smoke.sh
      - run: python3 tests/release.test.py
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-root-only

  debian-13:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build-release.py
      - name: Preparar Debian 13 descartável com systemd
        run: |
          docker build -t systv-debian-test -f tests/deploy/Dockerfile .
          docker run -d --name systv-debian --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw systv-debian-test
          docker exec systv-debian mkdir -p /tmp/systv-source
          docker cp dist/systv-v$(cat VERSION).tar.gz systv-debian:/tmp/systv.tar.gz
          docker exec systv-debian tar -xzf /tmp/systv.tar.gz -C /tmp/systv-source
          docker cp tests/deploy/smoke.sh systv-debian:/tmp/smoke.sh
      - name: Instalar, autenticar, atualizar, reverter e reiniciar
        run: |
          for attempt in $(seq 1 30); do
            if timeout 15 docker exec systv-debian systemctl is-system-running --wait; then break; fi
            # Um container pode reportar degraded mesmo com systemd operacional.
            if docker exec systv-debian test -d /run/systemd/system; then break; fi
            sleep 1
          done
          docker exec systv-debian bash /tmp/smoke.sh
      - name: Diagnóstico em falha
        if: failure()
        run: |
          docker logs systv-debian || true
          docker exec systv-debian journalctl -u systv -u mariadb -u nginx --no-pager -n 100 || true
      - name: Remover ambiente descartável
        if: always()
        run: docker rm -f systv-debian || true
